name: windows

# Python kurulu olmayan Windows için iki biçim: tek dosyalık program (.exe, araclar/exe_paketi.py) ve zip
# (gömülü Python + .bat, araclar/windows_paketi.py; .exe'yi antivirüs engellerse yedek yol). Etiket (v*)
# gönderilince ikisi de üretilir, temiz bir Windows makinesinde sınanır ve SHA-256 özetiyle GitHub sürümüne
# yüklenir. Paket betikleri değişen PR'larda yalnızca üretilip sınanır.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - araclar/windows_paketi.py
      - araclar/exe_paketi.py
      - araclar/exe_giris.py
      - requirements.txt
      - requirements-exe.txt
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paket:
    runs-on: ubuntu-latest
    outputs:
      ad: ${{ steps.ad.outputs.ad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Paket adı
        id: ad
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then surum="${GITHUB_REF_NAME}"; else surum="${GITHUB_SHA::7}"; fi
          # Etiket adı dosya adına girer: yalnızca güvenli karakterler kalır
          surum="${surum//[^A-Za-z0-9._-]/_}"
          echo "ad=SocialEmpiresTR-${surum}-windows" >> "$GITHUB_OUTPUT"
      - name: Ruffle (sabit sürüm, önceden sıkıştırılmış)
        run: python -c "import sys; sys.path.insert(0, '.'); from oyun import ruffle; assert ruffle.hazirla(); ruffle.brotli_baslat(bekle=True)"
      - name: Paket
        env:
          AD: ${{ steps.ad.outputs.ad }}
        run: python araclar/windows_paketi.py --ad "${AD}" --cikti dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-paketi
          path: dist/
          if-no-files-found: error

  sinama:
    # Kabul kapısı: Python kurulmadan, gömülü Python ile 60 saniye içinde açılır.
    needs: paket
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-paketi
          path: dist
      - name: Özet
        shell: pwsh
        env:
          AD: ${{ needs.paket.outputs.ad }}
        run: |
          $ad = $env:AD
          $beklenen = (Get-Content "dist/$ad.zip.sha256").Split(" ")[0]
          $gercek = (Get-FileHash "dist/$ad.zip" -Algorithm SHA256).Hash.ToLower()
          if ($beklenen -ne $gercek) { throw "SHA-256 tutmuyor: $gercek" }
      - name: Aç ve 60 saniye içinde başlat
        shell: pwsh
        env:
          AD: ${{ needs.paket.outputs.ad }}
        run: |
          $ad = $env:AD
          Expand-Archive "dist/$ad.zip" -DestinationPath oyun
          $kok = "oyun/$ad"
          $env:PYTHONIOENCODING = "utf-8"   # başlatıcının yaptığı gibi
          $env:PYTHONUTF8 = "1"
          $sure = [Diagnostics.Stopwatch]::StartNew()
          $surec = Start-Process -FilePath "$kok/python/python.exe" -ArgumentList "server.py" `
            -WorkingDirectory $kok -PassThru -RedirectStandardOutput cikti.txt -RedirectStandardError hata.txt
          $hazir = $false
          while ($sure.Elapsed.TotalSeconds -lt 60 -and -not $surec.HasExited) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:5050/saglik/hazir" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $hazir = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          Write-Host ("Hazır olma süresi: {0:N1} sn" -f $sure.Elapsed.TotalSeconds)
          if ($hazir) {
            $s = Invoke-WebRequest "http://127.0.0.1:5050/saglik" -UseBasicParsing
            Write-Host $s.Content
            $r = Invoke-WebRequest "http://127.0.0.1:5050/ruffle/0.7.1/ruffle.js" -UseBasicParsing
            if ($r.StatusCode -ne 200) { $hazir = $false; Write-Host "Ruffle pakette yok" }
          }
          if (-not $surec.HasExited) { Stop-Process -Id $surec.Id -Force }
          Get-Content cikti.txt -Tail 40
          Get-Content hata.txt -Tail 40
          if (-not $hazir) { throw "Sunucu 60 saniye içinde hazır olmadı" }

  exe:
    # Tek dosyalık program Windows'ta derlenir (PyInstaller yalnızca kendi sisteminin programını üretir) ve aynı
    # makinede boş bir klasörden açılıp sınanır: 90 saniye içinde hazır, Ruffle pakette, kayıtlar programın yanında.
    needs: paket
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Derleme araçları
        run: pip install -r requirements-exe.txt
      - name: Program
        env:
          AD: ${{ needs.paket.outputs.ad }}
        run: python araclar/exe_paketi.py --ad "$env:AD" --cikti dist
      - name: Boş klasörde aç ve sına
        shell: pwsh
        env:
          AD: ${{ needs.paket.outputs.ad }}
        run: |
          $ad = $env:AD
          New-Item -ItemType Directory deneme | Out-Null
          Copy-Item "dist/$ad.exe" deneme/
          $env:SE_TARAYICI_ACMA = "1"   # CI'da tarayıcı açılmasın
          $sure = [Diagnostics.Stopwatch]::StartNew()
          $surec = Start-Process -FilePath "deneme/$ad.exe" -WorkingDirectory deneme -PassThru `
            -RedirectStandardOutput cikti.txt -RedirectStandardError hata.txt
          $hazir = $false
          while ($sure.Elapsed.TotalSeconds -lt 90 -and -not $surec.HasExited) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:5050/saglik/hazir" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $hazir = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          Write-Host ("Hazır olma süresi: {0:N1} sn" -f $sure.Elapsed.TotalSeconds)
          if ($hazir) {
            $r = Invoke-WebRequest "http://127.0.0.1:5050/ruffle/0.7.1/ruffle.js" -UseBasicParsing
            if ($r.StatusCode -ne 200) { $hazir = $false; Write-Host "Ruffle pakette yok" }
            $r = Invoke-WebRequest "http://127.0.0.1:5050/" -UseBasicParsing
            if ($r.StatusCode -ne 200) { $hazir = $false; Write-Host "Giriş sayfası açılmadı" }
            foreach ($yol in @("deneme/saves", "deneme/mods/mods.txt", "deneme/ayarlar.json")) {
              if (-not (Test-Path $yol)) { $hazir = $false; Write-Host "Programın yanında yok: $yol" }
            }
          }
          if (-not $surec.HasExited) { Stop-Process -Id $surec.Id -Force }
          Get-Content cikti.txt -Tail 40
          Get-Content hata.txt -Tail 40
          if (-not $hazir) { throw "Program 90 saniye içinde hazır olmadı" }
          $beklenen = (Get-Content "dist/$ad.exe.sha256").Split(" ")[0]
          $gercek = (Get-FileHash "dist/$ad.exe" -Algorithm SHA256).Hash.ToLower()
          if ($beklenen -ne $gercek) { throw "SHA-256 tutmuyor: $gercek" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/
          if-no-files-found: error

  surum:
    if: github.ref_type == 'tag'
    needs: [paket, sinama, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-paketi
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: dist
      - name: GitHub sürümü
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Android iş akışı da aynı sürümü kurar; hangisi önce biterse o kurar, öteki ekler
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "Social Empires Türkçe ${GITHUB_REF_NAME}" --notes "Windows: .exe dosyasını bir klasöre koyup çift tıklayın (Python gerekmez; kayıtlar yanındaki saves klasöründe). Antivirüs .exe'yi engellerse zip'i açıp \"Social Empires.bat\" dosyasına çift tıklayın. SmartScreen uyarısında \"Ek bilgi\" > \"Yine de çalıştır\". Android: .apk dosyasını telefona/tablete indirip kurun (ANDROID.md). Dosyaların SHA-256 özetleri yanlarındaki .sha256 dosyalarında." || true
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
