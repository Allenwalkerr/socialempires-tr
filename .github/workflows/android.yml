name: android

# Android uygulaması (android/): oyunun Python sunucusu Chaquopy ile uygulamanın içinde çalışır, oyun tam
# ekran WebView'da açılır. APK üretilir, emülatörde açılış sınanır; etiket (v*) gönderilince GitHub
# sürümüne eklenir.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      # APK'ya giren ve ilk açılışta çalışan her şey (bot üretici, ayarlar, modlar, çeviriler...)
      - android/**
      - araclar/**
      - oyun/**
      - templates/**
      - config/**
      - villages/**
      - ceviri/**
      - stub/**
      - mods/**
      - assets/fonts/**
      - ayarlar.json
      - requirements.txt
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ad: ${{ steps.ad.outputs.ad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy, uygulamanın Python sürümüyle aynı sürümü derleme makinesinde ister. 3.11: Chaquopy'de
      # 32 bit Android'i (armeabi-v7a, eski Galaxy Tab A gibi) destekleyen son sürüm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Testler (uygulamanın Python sürümünde)
        run: |
          pip install -r requirements-test.txt
          python -m unittest discover -s tests
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
      - name: Ad
        id: ad
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then surum="${GITHUB_REF_NAME}"; else surum="${GITHUB_SHA::7}"; fi
          # Etiket adı dosya adına ve sonraki betiklere girer: yalnızca güvenli karakterler kalır
          surum="${surum//[^A-Za-z0-9._-]/_}"
          echo "surum=${surum}" >> "$GITHUB_OUTPUT"
          echo "ad=SocialEmpiresTR-${surum}-android" >> "$GITHUB_OUTPUT"
      - name: Oyun dosyaları
        run: python araclar/android_paketi.py
      # Sınama APK'sı: hata ayıklama yapısı (WebView DevTools yalnızca bunda açılır, DGV-06); sır görmez, her
      # tetikte derlenir. Yayımlanan APK bu değil, aşağıdaki sürüm yapısıdır.
      - name: Sınama APK'sı (hata ayıklama)
        env:
          SE_SURUM: ${{ steps.ad.outputs.surum }}
        run: gradle -p android :app:assembleDebug --stacktrace
      # İmza sırları yalnızca ana dala ve etiketlere gider; pull_request'te PR'ın kendi kodu sır görmez (DGV-03)
      - name: İmza anahtarı (varsa)
        if: github.event_name != 'pull_request'
        env:
          ANDROID_IMZA: ${{ secrets.ANDROID_IMZA }}
        run: |
          if [ -n "${ANDROID_IMZA}" ]; then
            printf '%s' "${ANDROID_IMZA}" | base64 -d > "${RUNNER_TEMP}/imza.jks"
            echo "SE_IMZA_DOSYASI=${RUNNER_TEMP}/imza.jks" >> "$GITHUB_ENV"
            echo "Sahibin anahtarıyla imzalanacak"
          else
            echo "::warning::ANDROID_IMZA sırrı yok; APK geçici anahtarla imzalanacak (güncellemede eski uygulama kaldırılmalı). ANDROID.md: İmza anahtarı"
          fi
      - name: APK (imzasız sürüm, pull_request)
        if: github.event_name == 'pull_request'
        env:
          SE_SURUM: ${{ steps.ad.outputs.surum }}
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: APK (imzalı sürüm)
        if: github.event_name != 'pull_request'
        env:
          SE_SURUM: ${{ steps.ad.outputs.surum }}
          SE_IMZA_SIFRESI: ${{ secrets.ANDROID_IMZA_SIFRESI }}
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Ad ve özet
        env:
          AD: ${{ steps.ad.outputs.ad }}
        run: |
          mkdir dist sinama
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${AD}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "sinama/${AD}-sinama.apk"
          cd dist && sha256sum "${AD}.apk" > "${AD}.apk.sha256"
          ls -la . ../sinama
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-sinama-apk
          path: sinama/
          if-no-files-found: error

  sinama:
    # Kabul kapısı: gerçek bir Android (emülatör) üzerinde uygulama açılır ve içindeki sunucu hazır olur
    needs: apk
    runs-on: ubuntu-latest
    # Varsayılan 6 saat; takılan bir adım PR'ı saatlerce bekletmesin
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-sinama-apk
          path: sinama
      - name: WebView sürücüsü
        # Uygulamanın WebView'u DevTools ile sürülür (android/sinama_oyun.js); tarayıcı indirilmez
        run: npm install --no-save --no-package-lock playwright-core@1.63.0
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          AD: ${{ needs.apk.outputs.ad }}
        with:
          # 35: kalıptaki WebView daha yeni (34'teki Chrome 113'tü); gerçek cihazlarda WebView Play Store'dan güncellenir
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          cores: 4
          # Varsayılan swiftshader_indirect, oyunun WebGL çizimi sırasında emülatörü düşürdü (REG-03;
          # issuetracker.google.com/issues/410512342); ANGLE üzerinden yazılım çizimi
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/sinama.sh "sinama/${AD}-sinama.apk" oyun.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-ekran
          path: oyun.png
          if-no-files-found: ignore

  surum:
    if: github.ref_type == 'tag'
    needs: [apk, sinama]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: dist
      - name: GitHub sürümüne ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Windows iş akışı da aynı sürümü kurar; hangisi önce biterse o kurar, öteki ekler
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "Social Empires Türkçe ${GITHUB_REF_NAME}" --notes "Windows: zip'i açın, \"Social Empires.bat\" dosyasına çift tıklayın (Python gerekmez). SmartScreen uyarısında \"Ek bilgi\" > \"Yine de çalıştır\". Android: .apk dosyasını telefona/tablete indirip kurun (ANDROID.md). Dosyaların SHA-256 özetleri yanlarındaki .sha256 dosyalarında." || true
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
